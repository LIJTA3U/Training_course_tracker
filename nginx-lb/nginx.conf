upstream frontend_pool {
    server web-frontend:80;
}

upstream course_pool {
    server course-service:8080;
}

upstream auth_pool {
    server auth-service:3000;
}

upstream progress_pool {
    server progress-service:3000;
}

server {
    listen 80;

    # DNS-резолвер встроенного DNS Docker (разрешает имена сервисов в runtime,
    # чтобы nginx не падал при старте, пока все микросервисы ещё не запущены)
    resolver 127.0.0.11 valid=30s;

    # Статический фронтенд — отдаёт HTML/CSS/JS
    location / {
        set $upstream_frontend web-frontend:80;
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API маршруты проксируются на соответствующие микросервисы
    location /api/courses {
        set $upstream_course course-service:8080;
        proxy_pass http://$upstream_course;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth {
        set $upstream_auth auth-service:3000;
        proxy_pass http://$upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/progress {
        set $upstream_progress progress-service:3000;
        proxy_pass http://$upstream_progress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
