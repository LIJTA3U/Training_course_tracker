name: training-course-tracker

services:
  db:
    image: postgres:17-alpine
    container_name: training-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coursetracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - training_net
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-coursetracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Микросервис 1: каталог курсов (.NET)
  course-service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-coursetracker};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    networks:
      - training_net
    depends_on:
      db:
        condition: service_healthy

  # Микросервис 2: аутентификация (Node.js)
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    networks:
      - training_net

  # Микросервис 3: прогресс обучения (Node.js)
  progress-service:
    build:
      context: ./services/progress-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
    networks:
      - training_net

  # Веб-интерфейс (статический HTML/CSS/JS)
  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - training_net

  # Балансировщик нагрузки + обратный прокси (nginx)
  nginx-lb:
    build:
      context: ./nginx-lb
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - training_net
    depends_on:
      - web-frontend
      - course-service
      - auth-service
      - progress-service

volumes:
  db_data:
    driver: local

networks:
  training_net:
    driver: bridge
