services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coursetracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  course-service:
    build:
      context: ./services/course-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=coursetracker;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    depends_on:
      db:
        condition: service_healthy

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

  progress-service:
    build:
      context: ./services/progress-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000

  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx-lb:
    build:
      context: ./nginx-lb
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - web-frontend
      - course-service
      - auth-service
      - progress-service

volumes:
  postgres_data: