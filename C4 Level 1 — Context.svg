<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" font-family="Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a365d">C4 Level 1 — Context (Контекст)</text>

  <!-- User -->
  <ellipse cx="100" cy="140" rx="45" ry="40" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="100" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a365d">Пользователь</text>
  <text x="100" y="165" text-anchor="middle" font-size="11" fill="#4a5568">Студент</text>

  <!-- System Boundary -->
  <rect x="250" y="60" width="560" height="340" fill="#f7fafc" stroke="#cbd5e0" stroke-width="2" rx="8"/>
  <text x="260" y="85" font-size="15" font-weight="bold" fill="#1a365d">Training Course Tracker</text>

  <!-- Web Frontend -->
  <rect x="290" y="110" width="160" height="70" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" rx="6"/>
  <text x="370" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a365d">Веб-интерфейс</text>
  <text x="370" y="152" text-anchor="middle" font-size="11" fill="#4a5568">HTML/CSS/JS + Nginx</text>

  <!-- Course Service -->
  <rect x="490" y="110" width="160" height="70" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" rx="6"/>
  <text x="570" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a365d">Course Service</text>
  <text x="570" y="152" text-anchor="middle" font-size="11" fill="#4a5568">.NET / ASP.NET Core</text>

  <!-- Auth Service -->
  <rect x="290" y="210" width="160" height="70" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" rx="6"/>
  <text x="370" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a365d">Auth Service</text>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#4a5568">Node.js / Express</text>

  <!-- Progress Service -->
  <rect x="490" y="210" width="160" height="70" fill="#ebf8ff" stroke="#3182ce" stroke-width="2" rx="6"/>
  <text x="570" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a365d">Progress Service</text>
  <text x="570" y="252" text-anchor="middle" font-size="11" fill="#4a5568">Node.js / Express</text>

  <!-- External DB -->
  <rect x="720" y="240" width="70" height="60" fill="#faf5ff" stroke="#9f7aea" stroke-width="2" rx="6"/>
  <text x="755" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#553c9a">PostgreSQL</text>
  <text x="755" y="282" text-anchor="middle" font-size="10" fill="#4a5568">внешняя БД</text>

  <!-- Relationships -->
  <line x1="145" y1="140" x2="290" y2="145" stroke="#4a5568" stroke-width="2"/>
  <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
  </marker>
  <line x1="145" y1="140" x2="290" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="210" y="132" font-size="10" fill="#4a5568">HTTP</text>

  <line x1="370" y1="180" x2="490" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="170" font-size="10" fill="#4a5568">HTTP/JSON</text>

  <line x1="370" y1="280" x2="490" y2="245" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="270" font-size="10" fill="#4a5568">HTTP/JSON</text>

  <line x1="570" y1="280" x2="650" y2="245" stroke="#4a5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="610" y="270" font-size="10" fill="#4a5568">HTTP/JSON</text>

  <line x1="570" y1="180" x2="720" y2="240" stroke="#9f7aea" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="640" y="195" font-size="10" fill="#553c9a">SQL</text>

  <!-- Legend -->
  <rect x="20" y="430" width="130" height="70" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1" rx="4"/>
  <text x="35" y="450" font-size="12" font-weight="bold" fill="#1a365d">Легенда</text>
  <text x="35" y="470" font-size="11" fill="#4a5568">👤 Пользователь</text>
  <text x="35" y="485" font-size="11" fill="#4a5568">📦 Микросервис</text>
  <text x="35" y="500" font-size="11" fill="#4a5568">🗄 Внешняя БД</text>
</svg>
